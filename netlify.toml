[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Force-redirect legacy category URLs to home (category feature removed from UI)
[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

# Redirect old tag URLs to home (tag feature removed)
[[redirects]]
  from = "/tag/*"
  to = "/"
  status = 301

# Content consolidation 301 redirects (eliminating keyword cannibalization)
[[redirects]]
  from = "/posts/how-to-debug-a-pc-that-randomly-reboots/*"
  to = "/posts/how-to-diagnose-a-random-reboot/"
  status = 301

[[redirects]]
  from = "/posts/how-to-debug-a-pc-that-randomly-reboots"
  to = "/posts/how-to-diagnose-a-random-reboot/"
  status = 301

[[redirects]]
  from = "/posts/ssd-vs-hdd-boot-speed/*"
  to = "/posts/ssd-vs-hdd-which-should-you-buy-in-2026/"
  status = 301

[[redirects]]
  from = "/posts/ssd-vs-hdd-boot-speed"
  to = "/posts/ssd-vs-hdd-which-should-you-buy-in-2026/"
  status = 301

[[redirects]]
  from = "/posts/how-to-build-a-quiet-gaming-rig/*"
  to = "/posts/how-to-build-a-silent-pc/"
  status = 301

[[redirects]]
  from = "/posts/how-to-build-a-quiet-gaming-rig"
  to = "/posts/how-to-build-a-silent-pc/"
  status = 301

[[redirects]]
  from = "/posts/why-your-pc-feels-slow-even-with-a-fast-cpu/*"
  to = "/posts/why-your-pc-feels-slow-even-when-it-has-good-specs/"
  status = 301

[[redirects]]
  from = "/posts/why-your-pc-feels-slow-even-with-a-fast-cpu"
  to = "/posts/why-your-pc-feels-slow-even-when-it-has-good-specs/"
  status = 301

[[redirects]]
  from = "/posts/how-to-choose-a-monitor-for-gaming-and-work/*"
  to = "/posts/best-monitor-for-work-and-gaming/"
  status = 301

[[redirects]]
  from = "/posts/how-to-choose-a-monitor-for-gaming-and-work"
  to = "/posts/best-monitor-for-work-and-gaming/"
  status = 301

# Ensure sitemap and RSS are served with correct content types
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/atom.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"

[[headers]]
  for = "/feed.atom"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"


[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Immutable cache for hashed Next.js chunks (never changes, safe to cache forever)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache for static images/fonts
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://adservice.google.com https://www.googletagservices.com https://tpc.googlesyndication.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.googletagmanager.com https://fundingchoicesmessages.google.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://fundingchoicesmessages.google.com https://translate.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com https://www.gstatic.com; img-src 'self' data: https: http:; connect-src 'self' https://pagead2.googlesyndication.com https://adservice.google.com https://www.google-analytics.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://fundingchoicesmessages.google.com https://translate.googleapis.com;"
